openapi: 3.1.0
info:
  title: Inter Coach API
  version: 1.0.0
  description: Backend API for uploading resumes and generating AI-backed resume analysis.
servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Resumes
  - name: Analysis
  - name: JobDescriptions
  - name: Matches

paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Check server and database status
      responses:
        "200":
          description: Server health state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a user and start an authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: Test User
                email:
                  type: string
                  format: email
                  example: testuser@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: Test@1234
      responses:
        "201":
          description: User created with access and refresh tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login and rotate the active session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: testuser@example.com
                password:
                  type: string
                  format: password
                  example: Test@1234
      responses:
        "200":
          description: User logged in with access and refresh tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/refresh-token:
    post:
      tags: [Auth]
      summary: Rotate a refresh token and receive a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Token pair refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout and invalidate the current session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session invalidated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          userId:
                            type: string
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/resumes:
    get:
      tags: [Resumes]
      summary: List resumes uploaded by the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resume list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          resumes:
                            type: array
                            items:
                              $ref: "#/components/schemas/ResumeSummary"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [Resumes]
      summary: Upload a PDF resume and extract text
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [resume]
              properties:
                resume:
                  type: string
                  format: binary
      responses:
        "201":
          description: Resume uploaded and processed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          resume:
                            $ref: "#/components/schemas/ResumeDetail"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/resumes/{resumeId}:
    get:
      tags: [Resumes]
      summary: Fetch one owned resume
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "200":
          description: Resume details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          resume:
                            $ref: "#/components/schemas/ResumeDetail"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Resumes]
      summary: Delete one owned resume and its uploaded file
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "200":
          description: Resume deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          resumeId:
                            type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/analysis/resume/{resumeId}:
    post:
      tags: [Analysis]
      summary: Generate AI analysis for an owned processed resume
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "201":
          description: Analysis created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          analysis:
                            $ref: "#/components/schemas/Analysis"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    get:
      tags: [Analysis]
      summary: List analyses for an owned resume
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "200":
          description: Analysis history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          analyses:
                            type: array
                            items:
                              $ref: "#/components/schemas/Analysis"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/analysis/{analysisId}:
    get:
      tags: [Analysis]
      summary: Fetch one owned analysis
      security:
        - bearerAuth: []
      parameters:
        - name: analysisId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Analysis details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          analysis:
                            $ref: "#/components/schemas/Analysis"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/job-descriptions:
    get:
      tags: [JobDescriptions]
      summary: List job descriptions saved by the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Job description list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          jobDescriptions:
                            type: array
                            items:
                              $ref: "#/components/schemas/JobDescriptionSummary"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [JobDescriptions]
      summary: Save a job description and extract its requirements
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, rawText]
              properties:
                title:
                  type: string
                  example: Backend Engineer
                company:
                  type: string
                  example: Acme Corp
                rawText:
                  type: string
                  minLength: 50
                  maxLength: 20000
      responses:
        "201":
          description: Job description created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          jobDescription:
                            $ref: "#/components/schemas/JobDescriptionDetail"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/job-descriptions/{jobDescriptionId}:
    get:
      tags: [JobDescriptions]
      summary: Fetch one owned job description
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobDescriptionId"
      responses:
        "200":
          description: Job description details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          jobDescription:
                            $ref: "#/components/schemas/JobDescriptionDetail"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [JobDescriptions]
      summary: Delete one owned job description
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobDescriptionId"
      responses:
        "200":
          description: Job description deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          jobDescriptionId:
                            type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/matches/resume/{resumeId}/job-description/{jobDescriptionId}:
    post:
      tags: [Matches]
      summary: Run a deterministic skill match between an owned resume and job description
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResumeId"
        - $ref: "#/components/parameters/JobDescriptionId"
      responses:
        "201":
          description: Match created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          match:
                            $ref: "#/components/schemas/Match"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/matches/resume/{resumeId}:
    get:
      tags: [Matches]
      summary: List matches for an owned resume
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "200":
          description: Match history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          matches:
                            type: array
                            items:
                              $ref: "#/components/schemas/Match"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/matches/{matchId}:
    get:
      tags: [Matches]
      summary: Fetch one owned match
      security:
        - bearerAuth: []
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Match details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          match:
                            $ref: "#/components/schemas/Match"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResumeId:
      name: resumeId
      in: path
      required: true
      schema:
        type: string
    JobDescriptionId:
      name: jobDescriptionId
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    ApiSuccess:
      type: object
      required: [statusCode, data, message, success]
      properties:
        statusCode:
          type: integer
        data:
          type: object
        message:
          type: string
        success:
          type: boolean
          const: true

    ApiError:
      type: object
      required: [success, statusCode, message, errors]
      properties:
        success:
          type: boolean
          const: false
        statusCode:
          type: integer
        message:
          type: string
        errors:
          type: array
          items:
            type: object
        data:
          type: object

    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccess"
        - type: object
          properties:
            data:
              type: object
              properties:
                status:
                  type: string
                  example: ok
                uptime:
                  type: number
                timestamp:
                  type: string
                  format: date-time
                database:
                  type: object
                  properties:
                    readyState:
                      type: integer
                    status:
                      type: string

    AuthResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccess"
        - type: object
          properties:
            data:
              type: object
              required: [user, accessToken, refreshToken]
              properties:
                user:
                  $ref: "#/components/schemas/User"
                accessToken:
                  type: string
                refreshToken:
                  type: string

    User:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ResumeSummary:
      type: object
      properties:
        resumeId:
          type: string
        fileName:
          type: string
        filePath:
          type: string
        fileSize:
          type: integer
        status:
          type: string
          enum: [uploaded, processing, processed, failed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ResumeDetail:
      allOf:
        - $ref: "#/components/schemas/ResumeSummary"
        - type: object
          properties:
            mimeType:
              type: string
              example: application/pdf
            extractedText:
              type: string

    Analysis:
      type: object
      properties:
        analysisId:
          type: string
        resumeId:
          type: string
        status:
          type: string
          enum: [processing, completed, failed]
        overallScore:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Computed in code from the per-dimension levels below using fixed
            rubric weights. The model never returns this number.
        scoreBand:
          type:
            - string
            - "null"
          enum: [Needs work, Developing, Solid, Strong, Exceptional, null]
        dimensions:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisDimension"
        strengths:
          type: array
          description: Flattened observations from strengthDetails. Retained for existing clients.
          items:
            type: string
        weaknesses:
          type: array
          description: Flattened observations from weaknessDetails. Retained for existing clients.
          items:
            type: string
        strengthDetails:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisFinding"
        weaknessDetails:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisFinding"
        recommendations:
          type: array
          description: Flattened actions from recommendationDetails, in the same rank order. Retained for existing clients.
          items:
            type: string
        recommendationDetails:
          type: array
          description: >-
            Ranked highest-value first. Ordering is computed in code from the
            rubric, not returned by the model.
          items:
            $ref: "#/components/schemas/AnalysisRecommendation"
        aiModel:
          type: string
        rubricVersion:
          type:
            - string
            - "null"
        promptVersion:
          type:
            - string
            - "null"
        errorMessage:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AnalysisDimension:
      type: object
      properties:
        key:
          type: string
          enum:
            [impact, technicalDepth, roleRelevance, structure, progression, signalQuality]
        label:
          type: string
        weight:
          type: integer
          description: Percentage this dimension contributes to overallScore.
          minimum: 0
          maximum: 100
        level:
          type: string
          enum: [weak, adequate, strong, exceptional]
        evidenceVerified:
          type: boolean
          description: >-
            False when every finding the model returned for this dimension
            failed evidence verification and was discarded.

    AnalysisFinding:
      type: object
      description: >-
        An observation bound to a checkable span of the resume. Findings whose
        evidence cannot be verified are discarded before the response is built.
      properties:
        dimension:
          type: string
          enum:
            [impact, technicalDepth, roleRelevance, structure, progression, signalQuality]
        dimensionLabel:
          type: string
        observation:
          type: string
        evidenceType:
          type: string
          enum: [quote, absence]
          description: >-
            "quote" means evidenceText was located verbatim in the resume.
            "absence" means it was confirmed not to appear.
        evidenceText:
          type: string
        impact:
          type: string

    AnalysisRecommendation:
      type: object
      description: >-
        A suggested change bound to a checkable span of the resume.
        Recommendations whose evidence cannot be verified, that name an unknown
        dimension, or that repeat an earlier target are discarded before the
        response is built.
      properties:
        dimension:
          type: string
          enum:
            [impact, technicalDepth, roleRelevance, structure, progression, signalQuality]
        dimensionLabel:
          type: string
        action:
          type: string
          description: The specific change to make.
        rewrite:
          type: string
          description: >-
            Paste-ready replacement line. Empty string when the advice is
            structural rather than a rewrite of one line.
        evidenceType:
          type: string
          enum: [quote, absence]
          description: >-
            "quote" means evidenceText is the existing line being changed.
            "absence" means it is a term confirmed missing from the resume.
        evidenceText:
          type: string
        scoreUpside:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Score points still recoverable in this recommendation's dimension -
            its full rubric weight when the level is weak, zero when it is
            already exceptional. This is the sort key.
        priority:
          type: string
          enum: [high, medium, low]
          description: Band derived from scoreUpside (>=12 high, >=5 medium, else low).

    JobDescriptionSummary:
      type: object
      properties:
        jobDescriptionId:
          type: string
        title:
          type: string
        company:
          type: string
        requirementsStatus:
          type: string
          enum: [pending, extracted, failed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JobDescriptionDetail:
      allOf:
        - $ref: "#/components/schemas/JobDescriptionSummary"
        - type: object
          properties:
            rawText:
              type: string
            mustHaveSkills:
              type: array
              items:
                type: string
            niceToHaveSkills:
              type: array
              items:
                type: string
            keyResponsibilities:
              type: array
              items:
                type: string

    Match:
      type: object
      properties:
        matchId:
          type: string
        resumeId:
          type: string
        jobDescriptionId:
          type: string
        status:
          type: string
          enum: [processing, completed, failed]
        matchScore:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 100
          description: Computed deterministically from skill coverage, not generated by the AI model.
        matchedSkills:
          type: array
          items:
            type: string
        missingSkills:
          type: array
          items:
            type: string
        recommendations:
          type: array
          items:
            type: string
        aiModel:
          type: string
        errorMessage:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
