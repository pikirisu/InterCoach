$kind: http-request
name: Upload Resume
method: POST
url: "{{baseUrl}}/api/v1/resumes"
order: 1000
headers:
  Authorization: Bearer {{authToken}}
body:
  type: formdata
  content:
    - type: file
      key: resume
      src:
        - /C:/Users/smrit/Downloads/Resume_Akshat.pdf
      description: Select a PDF file to upload
      disabled: false
scripts:
  - type: afterResponse
    code: ""
    language: text/javascript
